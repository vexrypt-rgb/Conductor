// The contract is shared by every version, including the Java 8 legacy runtimes, so it is written in Java 8 source.
tasks.named('compileJava', JavaCompile) {
    options.release = 8 // main sources only: the tests use newer APIs
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
