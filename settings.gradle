pluginManagement {
    repositories {
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'conductor'

include 'contract'

// One runtime adapter and one live harness per Minecraft version (see mcTargets in build.gradle).
['1.21.11', '1.21.4'].each { mc ->
    include "runtime-ostinato-${mc}"
    project(":runtime-ostinato-${mc}").projectDir = file("runtime-ostinato/${mc}")
    include "live-harness-${mc}"
    project(":live-harness-${mc}").projectDir = file("live-harness/${mc}")
    include "example-walk-and-stop-${mc}"
    project(":example-walk-and-stop-${mc}").projectDir = file("examples/walk-and-stop/${mc}")
}
