pluginManagement {
    repositories {
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'conductor'

include 'contract'

// Version-agnostic modules: plain Java, built once, depend on the contract only.
include 'example-walk-and-stop'
project(':example-walk-and-stop').projectDir = file('examples/walk-and-stop')
include 'example-agnostic-combat'
project(':example-agnostic-combat').projectDir = file('examples/agnostic-combat')
include 'example-player-actions'
project(':example-player-actions').projectDir = file('examples/player-actions')
include 'example-block-highlighter'
project(':example-block-highlighter').projectDir = file('examples/block-highlighter')
include 'example-engine-commands'
project(':example-engine-commands').projectDir = file('examples/engine-commands')
include 'example-ruby-content'
project(':example-ruby-content').projectDir = file('examples/ruby-content')
include 'example-server-greeter'
project(':example-server-greeter').projectDir = file('examples/server-greeter')

// Per Minecraft version (see mcTargets in build.gradle): Conductor's runtime (no engine), the optional Ostinato engine
// layer, the Conductor mod that hosts modules, and the live test harness. 1.16.1, 26.3 and 1.0.0 have no engine layer
// (and so no harness) yet.
['1.21.11', '1.21.4', '1.16.1', '26.3', '1.0.0'].each { mc ->
    include "runtime-${mc}"
    project(":runtime-${mc}").projectDir = file("runtime/${mc}")
    if (!(mc in ['1.16.1', '26.3', '1.0.0'])) {
        include "engine-ostinato-${mc}"
        project(":engine-ostinato-${mc}").projectDir = file("engine-ostinato/${mc}")
        include "live-harness-${mc}"
        project(":live-harness-${mc}").projectDir = file("live-harness/${mc}")
    }
    include "conductor-mod-${mc}"
    project(":conductor-mod-${mc}").projectDir = file("conductor-mod/${mc}")
}
