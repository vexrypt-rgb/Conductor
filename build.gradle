plugins {
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT' apply false
}

// Minecraft versions Conductor has a runtime for. The runtime needs only Minecraft. The optional Ostinato engine layer
// compiles against an Ostinato branch checkout's classes (ostinatoDir); Ostinato is never repackaged. Values mirror each branch's
// gradle.properties / build.gradle.
ext.mcTargets = [
    '1.21.11': [branch: 'main', parchment: '2025.12.20', loader: '0.19.5',
                ostinatoDir: findProperty('ostinatoDir') ?: "${rootDir}/../Ostinato"],
    '1.21.4' : [branch: '1.21.4', parchment: '2025.03.23', loader: '0.18.5',
                ostinatoDir: findProperty('ostinatoDir_1_21_4') ?: "${rootDir}/../Ostinato-1.21.4"],
    // A legacy target to test how far version-agnostic modules reach: no Parchment, no Ostinato, its own content code.
    '1.16.1' : [legacy: true, loader: '0.19.5'],
    // The same legacy shape on Minecraft 1.16.5 (pack format 6; dimension files are not translated yet).
    '1.16.5' : [legacy: true, loader: '0.19.5'],
    // The first year-numbered release Conductor targets: Mojang ships it unobfuscated (no intermediary) and it needs
    // Java 25. No engine layer yet.
    // The same unobfuscated, Java 25 shape as 26.3 (its renderer is still the one 26.3 changed; see the live run).
    '26.2'   : [noEngine: true, unobfuscated: true, java: 25, loader: '0.19.5'],
    '26.3'   : [noEngine: true, unobfuscated: true, java: 25, loader: '0.19.5'],
]

subprojects {
    apply plugin: 'java'

    group = 'conductor'
    version = '0.6.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
}
