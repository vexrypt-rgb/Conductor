// A version-agnostic Conductor module: plain Java, compiled once against the contract only. The same jar runs on
// every Minecraft version that has a Conductor runtime, under any mod loader Conductor boots from. No Minecraft,
// loader or engine classes are on the classpath, so the compiler itself keeps the module version-agnostic.
// The module is declared in META-INF/services/conductor.contract.ConductorModule (the JDK's service mechanism).
dependencies {
    compileOnly project(':contract')
}
