// Runtime integration + version adapter for one Minecraft version. Applied by runtime-ostinato/<mc>/build.gradle,
// which sets ext.mc. Shared sources and tests live in runtime-ostinato/common; only this project's own src differs.
apply plugin: 'xyz.wagyourtail.unimined'

def target = rootProject.mcTargets[mc]
def ostinatoDir = file(target.ostinatoDir)
def ostinatoClasses = files("${ostinatoDir}/build/classes/java/api", "${ostinatoDir}/build/classes/java/main")
ext.ostinatoClasses = ostinatoClasses

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.parchmentmc.net/' }
    mavenCentral()
}

sourceSets {
    main.java.srcDirs += rootProject.file('runtime-ostinato/common/src/main/java')
    test.java.srcDirs += rootProject.file('runtime-ostinato/common/src/test/java')
}

unimined.minecraft {
    version mc
    mappings {
        intermediary()
        mojmap()
        parchment(mc, target.parchment)
    }
    runs.off = true
    defaultRemapJar = false
}

dependencies {
    implementation project(':contract')
    compileOnly ostinatoClasses
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation ostinatoClasses
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    doFirst {
        if (!file("${ostinatoDir}/build/classes/java/main").isDirectory()) {
            throw new GradleException("Ostinato ${target.branch} classes not found under ${ostinatoDir}; "
                    + "build that branch first (./gradlew compileJava compileApiJava) or set its ostinatoDir property")
        }
    }
}
