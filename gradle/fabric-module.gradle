// A client Fabric mod built on Conductor, for one Minecraft version. Applied by <module>/<mc>/build.gradle, which
// sets ext.mc (a key of mcTargets) and ext.commonDir (the module's shared source folder, e.g. 'examples/walk-and-stop/common').
// Used by the live harness and by modules; see docs/TUTORIAL.md.
apply plugin: 'xyz.wagyourtail.unimined'

def target = rootProject.mcTargets[mc]
if (target.java) {
    java.toolchain.languageVersion = JavaLanguageVersion.of(target.java)
    tasks.withType(JavaCompile).configureEach { options.release = target.java }
}
def runtime = project(":runtime-${mc}")
def engine = target.legacy || target.noEngine ? null : project(":engine-ostinato-${mc}") // no engine layer for these yet
evaluationDependsOn(runtime.path)
if (engine) {
    evaluationDependsOn(engine.path)
}

repositories {
    if (target.ancient) {
        maven { url = 'https://maven.ornithemc.net/releases' }
        maven { url = 'https://repo.legacyfabric.net/repository/legacyfabric/' } // 1.0's LWJGL 2 build
    }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.parchmentmc.net/' }
    mavenCentral()
}

sourceSets {
    main.java.srcDirs += rootProject.file("${commonDir}/src/main/java")
    if (target.ancient) {
        // 1.0's hooks are its own (no Brigadier, other class names), and so is its fabric.mod.json (it lists a
        // server-only mixin config)
        main.java.exclude 'conductor/host/mixin/**'
    } else {
        main.resources.srcDirs += rootProject.file("${commonDir}/src/main/resources")
    }
    // a module's code that only 1.21.x shares, if it has any (the Conductor mod's content mixins)
    def modern = rootProject.file("${commonDir}/../modern/src/main/java")
    if (!target.legacy && modern.isDirectory()) {
        main.java.srcDirs += modern
    }
}

unimined.minecraft {
    if (target.ancient) {
        minecraftData.launcherMetaUrl = uri('https://ornithemc.net/mc-versions/version_manifest.json')
        version mc
        side 'client'
        mappings {
            ornitheGenVersion = 2
            calamus()
            feather(target.feather)
            devNamespace 'feather'
        }
        ornitheFabric {
            loader target.loader
            prodNamespace 'calamus'
        }
    } else {
        version mc
        mappings {
            if (!target.unobfuscated) {
                intermediary()
            }
            mojmap()
            if (target.parchment) {
                parchment(mc, target.parchment)
            }
        }
        fabric {
            loader target.loader
        }
    }
    runs.off = true
}

// 1.0's client and server are separate jars with separate Calamus names, so server hooks are compiled against the
// server jar in their own source set (src/server, plus the runtime's runtime/<mc>/src/server) and remapped with the
// server's names. modJar is the one mod jar: the client-remapped jar plus the server source set's own classes from the
// server-remapped jar. Fabric loads only the server mixin config on a server, and never loads client classes there.
if (target.ancient) {
    sourceSets {
        server {
            java.srcDirs += rootProject.file("runtime/${mc}/src/server/java")
            // not main's classpath: that holds the client jar, whose classes share names (not members) with the server's
            compileClasspath += main.output + files(runtime.sourceSets.main.output, project(':contract').sourceSets.main.output)
        }
    }
    unimined.minecraft(sourceSets.server) {
        combineWith(sourceSets.main)
        side 'server'
    }
    tasks.register('modJar', Jar) {
        dependsOn remapJar, remapServerJar
        archiveClassifier = 'mod'
        from(zipTree(remapJar.archiveFile))
        from(zipTree(remapServerJar.archiveFile)) {
            include 'conductor/runtime/ServerHooks*.class', 'conductor/host/mc10/server/**', 'conductor-server.mixins*.json'
        }
    }
    build.dependsOn modJar
}

// bundleConductor = false: a module that runs inside an installed Conductor mod; contract and runtime come from it.
def bundle = !project.hasProperty('bundleConductor') || project.bundleConductor

dependencies {
    if (target.ancient) {
        compileOnly 'org.apache.logging.log4j:log4j-api:2.19.0' // see runtime.gradle
    }
    if (bundle) {
        implementation project(':contract')
        implementation runtime
        if (engine) {
            implementation engine
        }
    } else {
        compileOnly project(':contract')
    }
    if (engine) {
        compileOnly engine.ostinatoClasses // only the live harness uses Ostinato directly
    }
}

processResources {
    inputs.property 'mc', mc
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand mc: mc, version: project.version
    }
}

// Ship contract, runtime and the optional engine layer inside the mod, so the remap to intermediary covers their
// Minecraft references too. The engine layer is only loaded when Ostinato is installed.
if (bundle) {
    jar {
        from project(':contract').sourceSets.main.output
        from runtime.sourceSets.main.output
        if (engine) {
            from engine.sourceSets.main.output
        }
    }
}
