// Conductor's runtime for one Minecraft version. Applied by runtime/<mc>/build.gradle, which sets ext.mc. Sources
// and tests every version shares live in runtime/common; runtime/modern adds the ones only 1.21.x shares. No engine (Ostinato or otherwise) is on the classpath: the compiler
// itself keeps the runtime independent of it.
apply plugin: 'xyz.wagyourtail.unimined'

def target = rootProject.mcTargets[mc]
if (target.java) {
    java.toolchain.languageVersion = JavaLanguageVersion.of(target.java)
    tasks.withType(JavaCompile).configureEach { options.release = target.java }
}

repositories {
    if (target.ancient) {
        maven { url = 'https://maven.ornithemc.net/releases' }
        maven { url = 'https://repo.legacyfabric.net/repository/legacyfabric/' } // 1.0's LWJGL 2 build
    }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.parchmentmc.net/' }
    mavenCentral()
}

sourceSets {
    main.java.srcDirs += rootProject.file('runtime/common/src/main/java')
    if (!target.legacy) {
        main.java.srcDirs += rootProject.file('runtime/modern/src/main/java')
    }
    test.java.srcDirs += rootProject.file('runtime/common/src/test/java')
}

unimined.minecraft {
    if (target.ancient) {
        // Mojang's manifest calls it "1.0" and lists no server jar; Ornithe's names it 1.0.0 and has both. The
        // runtime is client code; the server's hooks are compiled in the Conductor mod (gradle/fabric-module.gradle).
        minecraftData.launcherMetaUrl = uri('https://ornithemc.net/mc-versions/version_manifest.json')
        version mc
        side 'client'
        mappings {
            ornitheGenVersion = 2
            calamus()
            feather(target.feather)
            devNamespace 'feather'
        }
    } else {
        version mc
        mappings {
            if (!target.unobfuscated) {
                intermediary()
            }
            mojmap()
            if (target.parchment) {
                parchment(mc, target.parchment)
            }
        }
    }
    runs.off = true
    defaultRemapJar = false
}

dependencies {
    implementation project(':contract')
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    if (target.ancient) {
        compileOnly 'org.apache.logging.log4j:log4j-api:2.19.0' // ConductorLog names it; 1.0 has none, so it is never loaded
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}
